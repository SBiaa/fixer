name: Testes

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unidade:
    name: Tipos, lint e testes de unidade
    # Fixo em 24.04: o Playwright ainda não suporta o Ubuntu 26.04 do ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage

  e2e:
    name: Ponta a ponta (Playwright)
    # Fixo em 24.04: o Playwright ainda não suporta o Ubuntu 26.04 do ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # Chaves da instância de desenvolvimento do Clerk (sem elas o proxy responde 500).
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7
